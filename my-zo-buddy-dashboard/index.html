<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zo-Computer Restart Dashboard</title>
<style>
:root {
  --bg-primary: #121212;
  --bg-secondary: #1e1e1e;
  --text-primary: #e0e0e0;
  --text-accent: #bb86fc;
  --border-radius: 8px;
}

* { box-sizing: border-box; }

body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: Arial, sans-serif;
  padding: 20px;
  margin: 0;
}

.stats {
  background: var(--bg-secondary);
  padding: 15px;
  border-radius: var(--border-radius);
  margin: 15px 0;
}

h1 { color: var(--text-accent); margin-top: 0; }

.counters {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin: 15px 0;
}

.counter {
  text-align: center;
  background: var(--bg-primary);
  padding: 10px;
  border-radius: var(--border-radius);
}

.counter h3 {
  margin: 0;
  font-size: 1.1em;
  color: var(--text-accent);
}

.counter p { margin: 5px 0 0; font-size: 1.4em; font-weight: bold; }

.chart-container {
  max-width: 100%;
  margin: 30px auto;
  background: var(--bg-secondary);
  padding: 15px;
  border-radius: var(--border-radius);
}

#restartsList {
  list-style: none;
  padding: 0;
  margin: 0;
}

#restartsList li {
  padding: 8px 0;
  border-bottom: 1px solid #333;
}

.export-buttons {
  margin: 20px 0;
}

.export-buttons button {
  background: var(--text-accent);
  color: #fff;
  border: none;
  padding: 10px 20px;
  margin-right: 10px;
  border-radius: var(--border-radius);
  cursor: pointer;
}

.export-buttons button:hover { opacity: 0.9; }

@media (max-width: 600px) {
  body { padding: 10px; }
  .counters { grid-template-columns: repeat(2, 1fr); }
  .counter h3 { font-size: 0.9em; }
  .counter p { font-size: 1.2em; }
}
</style>
</head>
<body>
<h1>Zo-Computer Restart Dashboard</h1>
<div class="stats">
  <p><strong>Last Checked:</strong> <span id="lastChecked">Loading...</span></p>
  <div class="counters">
    <div class="counter"><h3>Total Restarts</h3><p id="totalRestarts">0</p></div>
    <div class="counter"><h3>Today</h3><p id="todayRestarts">0</p></div>
    <div class="counter"><h3>This Week</h3><p id="weekRestarts">0</p></div>
    <div class="counter"><h3>This Month</h3><p id="monthRestarts">0</p></div>
  </div>
  <div class="export-buttons">
    <button onclick="exportCSV()">Export CSV</button>
    <button onclick="exportPDF()">Export PDF</button>
  </div>
  <h2>Restart Events</h2>
  <ul id="restartsList"></ul>
</div>

<div class="chart-container">
  <canvas id="restartChart"></canvas>
</div>
<div class="chart-container">
  <canvas id="uptimeChart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script>
function etFormat(dateStr) {
  if (!dateStr) return 'Never';
  try {
    const options = { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false };
    return new Date(dateStr).toLocaleString('en-US', options);
  } catch (e) {
    console.error('Invalid date string:', dateStr, e);
    return dateStr;
  }
}
function etDateOnly(dateStr) {
  if (!dateStr) return '';
  try {
    const options = { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' };
    return new Date(dateStr).toLocaleString('en-CA', options);
  } catch (e) {
    console.error('Invalid date string:', dateStr, e);
    return dateStr;
  }
}
function getISOWeek(date) {
  const d = new Date(date);
  d.setHours(0,0,0,0);
  d.setDate(d.getDate() + 4 - (d.getDay()||7));
  const yearStart = new Date(d.getFullYear(),0,1);
  return Math.ceil(((d - yearStart) / 86400000 + 1)/7);
}
function exportCSV() {
  fetch('/my-zo-buddy-dashboard/restarts.json')
    .then(r=>r.json())
    .then(data=> {
      const csv = ['timestamp', ...(data.restarts||[])].join('\n');
      const blob = new Blob([csv],{type:'text/csv'});
      const url = URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='restarts.csv';a.click();URL.revokeObjectURL(url);
    })
    .catch(err=>{console.error('CSV export error',err);});
}
function exportPDF() {
  fetch('/my-zo-buddy-dashboard/restarts.json')
    .then(r=>r.json())
    .then(data=> {
      const {jsPDF}=window.jspdf;
      const doc=new jsPDF();
      doc.text('Zo-Computer Restart Report',10,10);
      doc.text(`Last Checked: ${etFormat(data.last_checked)}',10,20);
      doc.text(`Total Restarts: ${data.restarts?.length||0}',10,30);
      let y=40;
      (data.restarts||[]).forEach(ts=>{doc.text(etFormat(ts),10,y);y+=10;if(y>280){doc.addPage();y=20;}});
      doc.save('restarts.pdf');
    })
    .catch(err=>{console.error('PDF export error',err);});
}
function updateDashboard(data) {
  try {
    console.log('Dashboard update data:', data);
    document.getElementById('lastChecked').textContent = etFormat(data.last_checked);
    const restarts = Array.isArray(data.restarts) ? data.restarts : [];
    document.getElementById('totalRestarts').textContent = restarts.length;

    const dayCounts={}, weekCounts={}, monthCounts={};
    const now = new Date();
    const todayStr = etDateOnly(now.toISOString());
    const thisWeek = `${now.getFullYear()}-W${getISOWeek(now)}`;
    const thisMonth = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

    restarts.forEach(ts=>{
      const day = etDateOnly(ts);
      dayCounts[day]=(dayCounts[day]||0)+1;
      const weekKey = `${new Date(ts).getFullYear()}-W${getISOWeek(ts)}`;
      weekCounts[weekKey]=(weekCounts[weekKey]||0)+1;
      const monthKey = ts.substring(0,7);
      monthCounts[monthKey]=(monthCounts[monthKey]||0)+1;
    });
    document.getElementById('todayRestarts').textContent = dayCounts[todayStr]||0;
    document.getElementById('weekRestarts').textContent = weekCounts[thisWeek]||0;
    document.getElementById('monthRestarts').textContent = monthCounts[thisMonth]||0;

    // Restart chart
    const dates = Object.keys(dayCounts).sort();
    const restartCounts = dates.map(d=>dayCounts[d]);
    const restartLabels = dates.map(d=>etDateOnly(d));
    const restartCtx = document.getElementById('restartChart').getContext('2d');
    if(window.restartChart) window.restartChart.destroy();
    window.restartChart = new Chart(restartCtx,{{
      type:'line',
      data:{labels:restartLabels,datasets:[{
        label:'Restarts per Day (ET)',
        data:restartCounts,
        borderColor:'#3498db',
        backgroundColor:'rgba(52,152,219,0.1)',
        tension:0.1,
        fill:true
      }]},
      options:{responsive:true,
        scales:{y:{beginAtZero:true},x:{title:{display:true,text:'Date (ET)'}},y:{title:{display:true,text:'Count'}}},
        plugins:{legend:{display:true},tooltip:{mode:'index',intersect:false}}
      }
    });

    // Uptime accumulation chart
    const timestamps = restarts.slice().sort();
    const lastChecked = data.last_checked ? new Date(data.last_checked) : new Date();
    const points = [];
    let cumulativeMs = 0;
    let prev = timestamps.length ? new Date(timestamps[0]) : lastChecked;
    timestamps.forEach(ts=>{
      const cur = new Date(ts);
      const diff = cur - prev;
      if(diff>0) cumulativeMs += diff;
      points.push({time: cur, uptimeHours: cumulativeMs/3600000});
      prev = cur;
    });
    const finalDiff = lastChecked - prev;
    if(finalDiff>0) cumulativeMs += finalDiff;
    points.push({time: lastChecked, uptimeHours: cumulativeMs/3600000});

    const uptimeLabels = points.map(p=>etDateOnly(p.time.toISOString()));
    const uptimeData = points.map(p=>p.uptimeHours.toFixed(2));
    const uptimeCtx = document.getElementById('uptimeChart').getContext('2d');
    if(window.uptimeChart) window.uptimeChart.destroy();
    window.uptimeChart = new Chart(uptimeCtx,{{
      type:'line',
      data:{labels:uptimeLabels,datasets:[{
        label:'Cumulative Uptime (hours, ET)',
        data:uptimeData,
        borderColor:'#ffb74d',
        backgroundColor:'rgba(255,183,77,0.1)',
        tension:0.1,
        fill:true
      }]},
      options:{responsive:true,
        scales:{y:{beginAtZero:true},x:{title:{display:true,text:'Date (ET)'}},y:{title:{display:true,text:'Uptime (hours)'}}},
        plugins:{legend:{display:true},tooltip:{mode:'index',intersect:false}}
      }
    });

    // Restart list
    const list=document.getElementById('restartsList');
    list.innerHTML='';
    restarts.forEach(ts=>{
      const li=document.createElement('li');
      li.textContent=etFormat(ts);
      list.appendChild(li);
    });
  } catch (e) {
    console.error('Dashboard update error', e);
    document.getElementById('lastChecked').textContent = 'Error processing data';
  }
}
// Initial load
fetch('/my-zo-buddy-dashboard/restarts.json')
  .then(r=>{console.log('Fetch response:', r); return r.json();})
  .then(data=>{console.log('Parsed data:', data); updateDashboard(data);})
  .catch(err=>{console.error('Fetch error',err); document.getElementById('lastChecked').textContent='Error loading data';});
// Poll every 5 minutes
setInterval(()=>{fetch('/my-zo-buddy-dashboard/restarts.json')
  .then(r=>r.json())
  .then(updateDashboard)
  .catch(err=>{console.error('Polling error',err); document.getElementById('lastChecked').textContent='Error loading data';});},300000);
</script>
</body>
</html>
